name: Data Ingestion Pipeline

# Runs the 611-source ingestion on a schedule. GitHub's runners are NOT
# IP-blocked like Vercel's serverless runtime and have no 13s limit, so this is
# where the heavy data gathering happens (Option A).

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write          # to commit the coverage report back

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh source triage
        run: python3 pipeline/triage.py

      - name: Refresh cached market data (+ keyed live sources)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          WALK_SCORE_API_KEY: ${{ secrets.WALK_SCORE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python3 scraper/aggregate.py || true
          python3 pipeline/keyed_sources.py || true   # EIA energy, BEA GDP, REIT quotes → public/data/market/*.json (no DB needed)

      - name: Refresh RePrime.com company content
        run: python3 pipeline/scrape_reprime.py || true

      - name: Load source catalog to Supabase (REST · service key, no DB password needed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/rest_load_catalog.py || true

      - name: Ingest — keyless live APIs (full)
        run: python3 pipeline/run_ingest.py --tier live_api --auth keyless --limit 250

      - name: Ingest — keyed live APIs (uses repo secrets)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          WALK_SCORE_API_KEY: ${{ secrets.WALK_SCORE_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python3 pipeline/run_ingest.py --tier live_api --auth api_key --limit 800 || true

      - name: Ingest — RSS feeds
        run: python3 pipeline/run_ingest.py --tier rss --limit 150 || true

      - name: Ingest — bulk / dataset downloads
        run: python3 pipeline/run_ingest.py --tier bulk --limit 1000 || true

      - name: Load fetched records to Supabase (REST · service key, no DB password needed)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RP_TIME_BUDGET: "1500"
        run: python3 pipeline/rest_load_records.py 0 9999 1000 || true

      - name: Load to Postgres (no-op until DATABASE_URL is set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install --quiet psycopg2-binary || true
          python3 pipeline/load_to_db.py || true
          python3 pipeline/load_sources.py || true
          python3 pipeline/enrich_counts.py || true
          python3 pipeline/sec_reits.py || true
          python3 pipeline/fred_cre.py || true
          python3 pipeline/treasury_curve.py || true
          python3 pipeline/credit_spreads.py || true
          python3 pipeline/flatten_records.py || true
          python3 pipeline/deep_records.py 5000 || true
          python3 pipeline/socrata_discover.py 16 500 || true

      # Phase 4 (ADR-002) — NL source discovery: embed any newly-loaded sources.
      # Idempotent: only embeds rows where embedded_at IS NULL.
      # No-ops cleanly if AI_GATEWAY_API_KEY / OPENAI_API_KEY isn't set yet.
      - name: Embed sources for NL discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
        run: python3 pipeline/embed_sources.py || true

      - name: Commit coverage report + cached data
        run: |
          git config user.name "reprime-ingest"
          git config user.email "ingest@reprime.com"
          git add pipeline/ingest_report.json pipeline/ingest_manifest.json public/data/ || true
          git commit -m "chore(ingest): scheduled run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push || echo "push skipped"
