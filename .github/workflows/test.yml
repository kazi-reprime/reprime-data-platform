name: test

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "pipeline/**"
      - "scraper/**"
      - "tests/**"
      - "pytest.ini"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest pytest-timeout

      - name: Run unit tests (no network)
        run: pytest tests/ -m unit -v

      - name: Run integration tests (live APIs, non-blocking)
        timeout-minutes: 3
        continue-on-error: true
        run: pytest tests/ -m integration -v --timeout=60 || echo "::warning::Integration tests failed — live API issue or transient network error"
