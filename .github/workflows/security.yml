# Phase 2 task 2.13 — gitleaks runs on every push & PR. A leaked secret
# fails the workflow and blocks merge.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we catch historical leaks
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true

# pytest moved to test.yml — it runs unit tests as a blocking step and
# integration tests (live APIs) as a timeboxed, non-blocking step. The
# previous unmarked pytest job here hung on live-API integration tests.
