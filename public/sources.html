<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Sources — RePrime</title>
<meta name="description" content="The full RePrime data-source catalog — 1,787 free government and market data sources across 14 categories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/rp-shell.css">
</head>
<body class="rp-has-ticker">
<!-- Header (nav), topper (ticker) and footer are injected by /rp-shell.js -->
<section style="max-width:1280px;margin:0 auto;padding:48px 32px 8px;text-align:center;position:relative;z-index:1">
  <div style="font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px">Catalog</div>
  <h1 style="font-size:clamp(32px,5vw,52px);font-weight:800;color:var(--text);line-height:1.05">Every Data Source<br>We Track</h1>
  <p style="font-size:15px;color:var(--muted);font-weight:300;max-width:640px;margin:16px auto 0;line-height:1.7">1,787 free government and market data sources across 14 categories — the registry powering every deal analysis in the Terminal. Search, filter, and explore the full catalog.</p>
</section>
<div style="padding:0 32px;position:relative;z-index:1">
  <div id="viz-counters"></div>
  <div id="viz-globe"></div>
  <!-- Phase 4: NL source discovery (mounts /api/discover-backed search above the keyword catalog) -->
  <div id="rp-discover"></div>
  <div id="rp-sources"></div>
  <div id="viz-catbubble"></div>
  <div id="viz-heatmap"></div>
</div>
<script src="/rp-shell.js"></script>
<script src="/supabase-config.js"></script>
<script src="/rp-3d-curved-text.js"></script>
<script src="/viz.js"></script>
<script src="/globe.js"></script>
<script src="/sources.js"></script>
<!-- Phase 4 NL discovery UI -->
<script src="/discover.js"></script>
<script src="/live-data.js"></script>
</body>
</html>
