<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePrime Data Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--purple:#a855f7}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1e3a5f,#0f172a);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;gap:16px}
.header h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{color:var(--muted);font-size:14px}
.container{max-width:1400px;margin:0 auto;padding:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.stat-card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.stat-card .value{font-size:32px;font-weight:700}
.stat-card .value.blue{color:var(--accent)}
.stat-card .value.green{color:var(--green)}
.stat-card .value.red{color:var(--red)}
.stat-card .value.yellow{color:var(--yellow)}
.stat-card .value.purple{color:var(--purple)}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.section h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:180px;font-size:13px;text-align:right;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;background:#0f172a;border-radius:4px;height:28px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;transition:width .5s}
.bar-count{width:60px;font-size:13px;color:var(--muted);text-align:right}
.controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.controls input,.controls select{background:#0f172a;border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:14px}
.controls input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px}
tr:hover{background:rgba(59,130,246,.05)}
.badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600}
.badge.success{background:rgba(34,197,94,.15);color:var(--green)}
.badge.error{background:rgba(239,68,68,.15);color:var(--red)}
.badge.skip{background:rgba(234,179,8,.15);color:var(--yellow)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:800px;width:90%;max-height:80vh;overflow-y:auto;padding:24px}
.modal h3{margin-bottom:16px}
.modal .close{cursor:pointer;float:right;font-size:20px;color:var(--muted)}
.modal pre{background:#0f172a;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;max-height:400px;overflow-y:auto}
.donut-container{display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.donut{width:200px;height:200px}
.legend{display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-dot{width:12px;height:12px;border-radius:3px}
.footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>RePrime Data Platform</h1>
    <div class="sub">Real Estate Intelligence — 611 Sources Aggregated</div>
  </div>
</div>
<div class="container">
  <div class="stats-grid" id="stats-grid"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px">
    <div class="section">
      <h2>📊 Sources by Category</h2>
      <div class="bar-chart" id="cat-chart"></div>
    </div>
    <div class="section">
      <h2>🎯 Scrape Status</h2>
      <div class="donut-container">
        <canvas id="donut" class="donut" width="200" height="200"></canvas>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>📋 All Sources</h2>
    <div class="controls">
      <input type="text" id="search" placeholder="Search sources...">
      <select id="cat-filter"><option value="">All Categories</option></select>
      <select id="status-filter">
        <option value="">All Status</option>
        <option value="scraped">Scraped</option>
        <option value="missing">Missing</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Provider</th><th>Category</th><th>Auth</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="source-table"></tbody>
      </table>
    </div>
    <div id="pagination" style="margin-top:16px;display:flex;gap:8px;justify-content:center"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

<div class="footer">RePrime Data Platform v1.0 — Built 2026-06-02 — 552 sources scraped, 30,894 records</div>

<script>
const API = '';
let currentPage = 1;

async function fetchStats() {
  const r = await fetch(API + '/api/stats');
  const d = await r.json();
  const grid = document.getElementById('stats-grid');
  const cards = [
    {label:'Total Sources',value:d.total_sources,color:'blue'},
    {label:'Successfully Scraped',value:d.by_status.scraped,color:'green'},
    {label:'Total Records',value:d.total_records.toLocaleString(),color:'purple'},
    {label:'Errors',value:d.by_status.error,color:'red'},
    {label:'Paid (Skipped)',value:d.by_status.paid_skipped,color:'yellow'},
    {label:'Success Rate',value:Math.round(d.by_status.scraped/(d.total_sources-d.by_status.paid_skipped)*100)+'%',color:'green'},
  ];
  grid.innerHTML = cards.map(c=>`<div class="stat-card"><div class="label">${c.label}</div><div class="value ${c.color}">${c.value}</div></div>`).join('');

  // Category chart
  const cats = Object.entries(d.by_category).sort((a,b)=>b[1].total-a[1].total);
  const maxTotal = Math.max(...cats.map(c=>c[1].total));
  const colors = ['#3b82f6','#22c55e','#a855f7','#eab308','#ef4444','#06b6d4','#f97316','#ec4899','#14b8a6','#8b5cf6','#6366f1','#84cc16','#f59e0b','#10b981'];
  const chart = document.getElementById('cat-chart');
  chart.innerHTML = cats.map((c,i)=>{
    const pct = (c[1].scraped/Math.max(c[1].total,1))*100;
    const w = (c[1].total/maxTotal)*100;
    return `<div class="bar-row">
      <div class="bar-label">${c[0]}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${colors[i%colors.length]}">${c[1].scraped}/${c[1].total}</div></div>
      <div class="bar-count">${c[1].records}</div>
    </div>`;
  }).join('');

  // Donut
  drawDonut(d.by_status);
}

function drawDonut(status) {
  const canvas = document.getElementById('donut');
  const ctx = canvas.getContext('2d');
  const data = [
    {label:'Scraped',value:status.scraped,color:'#22c55e'},
    {label:'Errors',value:status.error,color:'#ef4444'},
    {label:'Not Scraped',value:status.not_scraped,color:'#64748b'},
    {label:'Paid Skipped',value:status.paid_skipped,color:'#eab308'},
  ];
  const total = data.reduce((s,d)=>s+d.value,0);
  const cx=100,cy=100,r=80,ir=50;
  let angle = -Math.PI/2;
  data.forEach(d=>{
    const slice = (d.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.arc(cx,cy,ir,angle+slice,angle,true);
    ctx.closePath();
    ctx.fillStyle=d.color;
    ctx.fill();
    angle+=slice;
  });
  const legend = document.getElementById('legend');
  legend.innerHTML = data.map(d=>`<div class="legend-item"><div class="legend-dot" style="background:${d.color}"></div>${d.label}: ${d.value}</div>`).join('');
}

async function fetchCategories() {
  const r = await fetch(API + '/api/categories');
  const d = await r.json();
  const sel = document.getElementById('cat-filter');
  Object.keys(d.categories).forEach(c=>{
    const o = document.createElement('option');
    o.value=c; o.textContent=`${c} (${d.categories[c]})`;
    sel.appendChild(o);
  });
}

async function fetchSources(page=1) {
  currentPage = page;
  const search = document.getElementById('search').value;
  const cat = document.getElementById('cat-filter').value;
  const status = document.getElementById('status-filter').value;
  const params = new URLSearchParams({page,limit:50});
  if(search) params.set('search',search);
  if(cat) params.set('category',cat);
  if(status) params.set('status',status);
  const r = await fetch(API+'/api/sources?'+params);
  const d = await r.json();
  const tb = document.getElementById('source-table');
  tb.innerHTML = d.sources.map(s=>`<tr>
    <td><code>${s.id}</code></td>
    <td>${s.name||'—'}</td>
    <td>${s.provider||'—'}</td>
    <td>${s.category||'—'}</td>
    <td>${s.auth||'—'}</td>
    <td><span class="badge ${s.scraped?'success':'error'}">${s.scraped?'Scraped':'Missing'}</span></td>
    <td><button onclick="viewSource('${s.id}')" style="background:var(--accent);color:white;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px">View</button></td>
  </tr>`).join('');

  const pages = Math.ceil(d.total/50);
  const pg = document.getElementById('pagination');
  let html = '';
  for(let i=1;i<=Math.min(pages,10);i++){
    html+=`<button onclick="fetchSources(${i})" style="background:${i===page?'var(--accent)':'var(--card)'};color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer">${i}</button>`;
  }
  pg.innerHTML = html;
}

async function viewSource(id) {
  const r = await fetch(API+'/api/sources/'+id);
  const d = await r.json();
  document.getElementById('modal-title').textContent = `${id} — ${d.meta?.name||'Unknown'}`;
  let html = `<p><strong>Provider:</strong> ${d.meta?.provider||'—'}</p>
    <p><strong>Category:</strong> ${d.meta?.category||'—'}</p>
    <p><strong>Endpoint:</strong> <a href="${d.meta?.endpoint}" target="_blank" style="color:var(--accent)">${d.meta?.endpoint||'—'}</a></p>
    <p><strong>Auth:</strong> ${d.meta?.auth||'—'}</p>
    <p><strong>Records:</strong> ${d.record_count}</p>
    <p><strong>Scraped At:</strong> ${d.scraped_at||'—'}</p>`;
  if(d.records&&d.records.length) {
    html += `<h4 style="margin-top:16px">Sample Records (first ${Math.min(d.records.length,10)})</h4>
    <pre>${JSON.stringify(d.records.slice(0,10),null,2)}</pre>`;
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('active')}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});

document.getElementById('search').addEventListener('input',()=>fetchSources(1));
document.getElementById('cat-filter').addEventListener('change',()=>fetchSources(1));
document.getElementById('status-filter').addEventListener('change',()=>fetchSources(1));

fetchStats();
fetchCategories();
fetchSources();
</script>
</body>
</html>
