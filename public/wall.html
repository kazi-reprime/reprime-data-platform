<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RePrime — Data Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/rp-shell.css">
<style>
/* Page-specific styles only. Chrome (tokens, nav, ticker, footer, themes,
   background) lives in rp-shell.css / rp-shell.js — single source of truth. */
body{padding-bottom:60px}
.head{padding:28px;max-width:1600px;margin:0 auto}
h1{font-family:'Poppins',Arial,sans-serif;font-size:28px;font-weight:800}
.grad{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:13px;margin:6px 0 14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.controls input,.controls select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;font-family:inherit}
.controls input{flex:1;min-width:220px}
.count{color:var(--gold);font-family:'JetBrains Mono',monospace;font-weight:700}
.wall{max-width:1600px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;font-size:11px;min-height:74px;overflow:hidden;transition:.15s;border-left:3px solid var(--accent)}
.box:hover{background:var(--surface2);transform:translateY(-2px)}
.box .t{font-weight:700;color:var(--text);font-size:11.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box .m{color:var(--muted);font-size:10px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box .tag{display:inline-block;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--dim);margin-top:5px}
.box.rec{border-left-color:var(--green)}
.box .num{font-family:'JetBrains Mono',monospace;color:var(--green);font-weight:700}
.sentinel{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12px;padding:14px}
</style>
</head>
<body class="rp-has-ticker">
<!-- Header (nav), topper (ticker) and footer are injected by /rp-shell.js -->
<div class="head">
  <h1>The <span class="grad">Data Wall</span></h1>
  <div class="sub">Every cataloged source and every ingested record, live from Supabase. <span class="count" id="total">…</span> boxes.</div>
  <div class="controls">
    <input id="q" placeholder="🔍 Filter boxes — source, category, record text…">
    <select id="kind"><option value="">All boxes</option><option value="source">Sources</option><option value="record">Records</option></select>
  </div>
</div>
<div style="padding:0 28px"><div id="viz-counters"></div><div id="viz-kpis"></div><div id="viz-catbubble"></div></div>

<!-- Phase 6.3 + 6.4: heatmap and Bloomberg-style deal feed above the wall list -->
<div style="padding:0 28px"><div id="viz-heatmap-us"></div></div>
<div style="padding:0 28px"><div id="viz-risk-surface"></div></div>
<div style="padding:0 28px"><div id="rp-deal-feed"></div></div>
<div style="padding:0 28px"><div id="viz-deal-flow-globe"></div></div>

<div class="wall" id="wall"></div>
<script src="/rp-shell.js"></script>
<script src="/supabase-config.js"></script>
<script src="/viz.js"></script>
<!-- Phase 6 components -->
<script src="/deal-flow-globe.js"></script>
<script src="/property-heatmap.js"></script>
<script src="/deal-feed.js"></script>
<script src="/risk-surface-3d.js"></script>
<script>
// Phase 2.3 — use centralized config (window.RP_SB); defensive fallback if not loaded.
const CFG = window.RP_SB || { URL: "https://gugcmsqrscqqqltdtgkz.supabase.co", KEY: "sb_publishable_J5zIiHNf1VqpQ7r14SevFw__MbvlEpm" };
const SB = CFG.URL, K = CFG.KEY;
const H = { apikey: K, Authorization: "Bearer " + K };
const cl=['#BC9C45','#1D5FB8','#00A1FF','#009080','#FFBC7D','#0E3470','#00A980','#BC9C45','#1D5FB8','#00A1FF','#009080','#FFBC7D','#0E3470','#00A980'];
let BOXES=[], shown=0, PAGE=300;
const esc=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function flat(p){if(!p)return[];if(Array.isArray(p))return p.map(r=>r&&r.attributes?r.attributes:r).filter(x=>x&&typeof x==='object');if(typeof p==='object')for(const k of['features','results','data','items','records'])if(Array.isArray(p[k]))return p[k].map(r=>r&&r.attributes?r.attributes:r).filter(x=>x&&typeof x==='object');return[];}
function recLabel(r){const ks=Object.keys(r).filter(k=>!k.startsWith('_')).slice(0,3);return ks.map(k=>esc(r[k]).slice(0,28)).filter(Boolean).join(' · ');}

async function build(){
  // 1) source boxes (full catalog)
  let cats={};
  try{
    const reg=await (await fetch('/data/sources_all.json')).json();
    const srcs=reg.sources||[];
    srcs.forEach((s,i)=>{ const ci=Object.keys(cats).indexOf(s.category); if(ci<0)cats[s.category]=Object.keys(cats).length;
      BOXES.push({kind:'source',color:cl[cats[s.category]%14],t:s.name,m:(s.provider||s.category||''),tag:s.category,search:(s.name+' '+s.category+' '+(s.provider||'')).toLowerCase()});});
  }catch(e){}
  // 2) record boxes — page through the flattened data_records table (scales to thousands)
  try{
    for(let off=0; off<20000; off+=1000){
      const page=await (await fetch(SB+'/rest/v1/data_records?select=source_name,category,fields&limit=1000&offset='+off,{headers:H})).json();
      if(!page.length) break;
      page.forEach(r=>{ const lbl=recLabel(r.fields||{}); if(lbl) BOXES.push({kind:'record',color:'#22c55e',t:lbl,m:r.source_name,tag:r.category||'record',search:(lbl+' '+r.source_name).toLowerCase()}); });
      document.getElementById('total').textContent=BOXES.length.toLocaleString();
      if(page.length<1000) break;
    }
  }catch(e){}
  document.getElementById('total').textContent=BOXES.length.toLocaleString();
  render(true);
}
function filtered(){const q=document.getElementById('q').value.toLowerCase(),k=document.getElementById('kind').value;
  return BOXES.filter(b=>(!k||b.kind===k)&&(!q||b.search.includes(q)));}
function render(reset){
  const wall=document.getElementById('wall'); const list=filtered();
  if(reset){wall.innerHTML='';shown=0;}
  const slice=list.slice(shown,shown+PAGE);
  wall.insertAdjacentHTML('beforeend',slice.map(b=>`<div class="box ${b.kind==='record'?'rec':''}" style="border-left-color:${b.color}"><div class="t">${esc(b.t)}</div>${b.m?`<div class="m">${esc(b.m)}</div>`:''}<div class="tag">${esc(b.tag)}</div></div>`).join(''));
  shown+=slice.length;
  let s=document.getElementById('sentinel'); if(!s){s=document.createElement('div');s.id='sentinel';s.className='sentinel';wall.appendChild(s);} else wall.appendChild(s);
  s.textContent= shown<list.length ? `Showing ${shown.toLocaleString()} of ${list.length.toLocaleString()} — scroll for more` : `${list.length.toLocaleString()} boxes`;
}
// infinite scroll
addEventListener('scroll',()=>{ if(window.innerHeight+scrollY>=document.body.offsetHeight-600) render(false); });
['q','kind'].forEach(id=>document.getElementById(id).addEventListener('input',()=>render(true)));
build();
</script>
</body>
</html>
