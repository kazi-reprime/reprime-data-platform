services:
  - type: web
    name: reprime-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api.server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRED_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: BLS_API_KEY
        sync: false
      - key: WALK_SCORE_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: MAPBOX_API_KEY
        sync: false
      - key: MAPILLARY_API_KEY
        sync: false
      - key: YELP_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false
